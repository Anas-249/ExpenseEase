<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Login/Sign Up Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2 id="form-title">Sign In</h2>
    <form id="toggleForm">
      <div class="input-field" id="email-field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="input-field" id="username-field" style="display: none;">
        <label for="username">Username</label>
        <input type="text" id="username">
      </div>
      <div class="input-field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="input-field" id="confirm-password-field" style="display: none;">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password">
      </div>
      <button type="submit" id="submit-btn">Sign In</button>
      <p id="toggle-text">Don't have an account? <span id="toggle-link">Sign Up</span></p>
      <p id="message">Continue as guest and go <a href="image.png" >Home</a></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
