<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.2.1/dist/chart.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e9ecef);
      margin: 0;
      padding: 0;
    }

    .navbar {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
    }

    .expense-tracker {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .expense-form h2, .expense-history h3 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    .expense-form input, .expense-form button {
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 16px;
    }

    .expense-form button {
      background: #4CAF50;
      color: white;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .expense-form button:hover {
      background: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      text-align: center;
      padding: 10px;
      border: 1px solid #ddd;
    }

    table th {
      background: #4CAF50;
      color: white;
    }

    table tr:nth-child(even) {
      background: #f9f9f9;
    }

    .chart-container {
      margin: 30px auto;
      max-width: 700px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">MyBudget</a>
  </nav>

  <div class="container">
    <div class="expense-tracker">
      <div class="expense-form">
        <h2>Track Your Expenses</h2>
        <form id="expense-form">
          <input type="text" id="expense-name" class="form-control" placeholder="Expense Name" required>
          <input type="number" id="expense-amount" class="form-control" placeholder="Amount" min="0" required>
          <input type="date" id="expense-date" class="form-control" required>
          <button type="submit" class="btn btn-block">Add Expense</button>
        </form>
      </div>
      <div class="expense-history">
        <h3>Expense History</h3>
        <table>
          <thead>
            <tr>
              <th>Expense Name</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-history-table">
            <!-- Dynamic rows will go here -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2024 MyBudget. All rights reserved.</p>
  </footer>

  <script>
    const chartData = {
      labels: [],
      datasets: [{
        label: 'Expenses',
        data: [],
        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'],
      }]
    };

    const expenseChart = new Chart(document.getElementById('expenseChart'), {
      type: 'pie',
      data: chartData,
    });

    document.getElementById('expense-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('expense-name').value.trim();
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const date = document.getElementById('expense-date').value;

      if (!name || amount <= 0 || !date) {
        alert('All fields are required, and amount must be positive.');
        return;
      }

      const tableBody = document.getElementById('expense-history-table');
      const row = tableBody.insertRow();
      row.insertCell(0).textContent = name;
      row.insertCell(1).textContent = `$${amount.toFixed(2)}`;
      row.insertCell(2).textContent = new Date(date).toLocaleDateString();

      const deleteCell = row.insertCell(3);
      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'Delete';
      deleteButton.classList.add('btn', 'btn-danger', 'btn-sm');
      deleteButton.onclick = () => {
        const index = chartData.labels.indexOf(name);
        if (index > -1) {
          chartData.labels.splice(index, 1);
          chartData.datasets[0].data.splice(index, 1);
          expenseChart.update();
        }
        row.remove();
      };
      deleteCell.appendChild(deleteButton);

      if (!chartData.labels.includes(name)) {
        chartData.labels.push(name);
        chartData.datasets[0].data.push(amount);
      } else {
        const index = chartData.labels.indexOf(name);
        chartData.datasets[0].data[index] += amount;
      }
      expenseChart.update();

      document.getElementById('expense-name').value = '';
      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-date').value = '';
    });
  </script>
</body>
</html>
