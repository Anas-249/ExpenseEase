<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.2.1/dist/chart.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" crossorigin="anonymous" />
  <title>Expense Ease</title>
  <style>
    /* General Styling */
    body {
      font-family: 'Roboto', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 250px;
      height: 100vh;
      background: #4CAF50;
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar h2 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      width: 100%;
    }

    .sidebar ul li {
      width: 100%;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: white;
      display: block;
      padding: 15px;
      text-align: center;
      transition: background 0.3s;
    }

    .sidebar ul li a:hover {
      background: #45a049;
    }

    /* Content Section */
    .content {
      margin-left: 250px;
      padding: 20px;
      width: calc(100% - 250px);
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metrics {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .metric-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 30%;
      text-align: center;
    }

    .metric-card h3 {
      color: #4CAF50;
      font-size: 20px;
    }

    .chart-section {
      display: flex;
      justify-content: space-between;
    }

    .chart-container {
      width: 48%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Expense Ease</h2>
    <ul>
      <li><a href="base.html">Dashboard</a></li>
      <li><a href="add.html">Add Expense</a></li>
      <li><a href="display.html">History</a></li>
      <li><a href="/limit">Set Limits</a></li>
      <li><a href="/reports">Reports</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- Header -->
    <div class="content-header">
      <h1>Welcome, User</h1>
      <button class="btn btn-success">Quick Add Expense</button>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric-card">
        <h3>Total Spent</h3>
        <p>$0.00</p>
      </div>
      <div class="metric-card">
        <h3>Budget Left</h3>
        <p>$0.00</p>
      </div>
      <div class="metric-card">
        <h3>Top Category</h3>
        <p>None</p>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="chart-section">
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="lineChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Pie Chart for category breakdown
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    const pieChart = new Chart(pieCtx, {
      type: 'pie',
      data: {
        labels: [],
        datasets: [{
          label: 'Expenses by Category',
          data: [],
          backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
        }]
      }
    });

    // Line Chart for expense trends
    const lineCtx = document.getElementById('lineChart').getContext('2d');
    const lineChart = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Expense Trend',
          data: [],
          borderColor: '#4CAF50',
          fill: false,
          tension: 0.1
        }]
      }
    });

    // Sample Data Update Logic
    document.querySelector('.btn-success').addEventListener('click', () => {
      // Example update logic
      pieChart.data.labels.push('Example');
      pieChart.data.datasets[0].data.push(50);
      pieChart.update();

      lineChart.data.labels.push(new Date().toLocaleDateString());
      lineChart.data.datasets[0].data.push(Math.random() * 100);
      lineChart.update();
    });
  </script>
</body>
</html>
