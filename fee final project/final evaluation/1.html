<div class="container" style="display: flex;">

    <div class="expense-tracker" style="width: 50%;">
        <!-- Expense Form Section -->
        <div class="expense-form">
            <h2>Expense Tracker</h2>
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Expense Name" required>
                <input type="number" id="expense-amount" placeholder="Amount" required>
                <input type="date" id="expense-date" required>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <!-- Expense History Section -->
        <div class="expense-history">
            <h3>Expense History</h3>
            <table id="expense-history-table">
                <thead>
                    <tr>
                        <th>Expense Name</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic rows will be added here -->
                </tbody>
            </table>
        </div>
    </div>
    <div class="container" style="width: 50%;">
        <!-- <canvas id="myChart" width="400" height="400"></canvas> -->
         <img src="addd.jpg" alt="">
        </div>
<div class="container" style="width: 50%;">
    <canvas id="expenseChart" width="400" height="400"></canvas>

<script>
    document.getElementById('expense-form').addEventListener('submit', function(event) {
      event.preventDefault();  // Prevent form submission
  
      // Get input values
      const name = document.getElementById('expense-name').value;
      const amount = document.getElementById('expense-amount').value;
      const date = document.getElementById('expense-date').value;
  
      if (name && amount && date) {
        addExpenseToHistory(name, amount, date);
        updateChart(); // Update chart after adding a new expense
  
        // Clear the form inputs after submission
        document.getElementById('expense-name').value = '';
        document.getElementById('expense-amount').value = '';
        document.getElementById('expense-date').value = '';
      }
    });
  
    function addExpenseToHistory(name, amount, date) {
      const tableBody = document.getElementById('expense-history-table').getElementsByTagName('tbody')[0];
  
      // Create a new row and cells
      const row = tableBody.insertRow();
  
      const cell1 = row.insertCell(0);
      const cell2 = row.insertCell(1);
      const cell3 = row.insertCell(2);
  
      // Set the values for each cell
      cell1.textContent = name;
      cell2.textContent = parseFloat(amount).toFixed(2);
      cell3.textContent = new Date(date).toLocaleDateString();
  
      // Optionally, you can add a delete button in each row if needed
      const deleteCell = row.insertCell(3);
      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'Delete';
      deleteButton.classList.add('delete-btn');
      deleteButton.onclick = function() {
        tableBody.deleteRow(row.rowIndex - 1); // Remove the row
        updateChart(); // Update the chart after deletion
      };
      deleteCell.appendChild(deleteButton);
    }
  
    // Fetch data from the table
    function getExpenseData() {
      const tableBody = document.getElementById('expense-history-table').getElementsByTagName('tbody')[0];
      const rows = tableBody.getElementsByTagName('tr');
      const expenseData = {};
  
      // Extract data from each row
      for (let i = 0; i < rows.length; i++) {
        const cells = rows[i].getElementsByTagName('td');
        const name = cells[0].textContent;
        const amount = parseFloat(cells[1].textContent);
  
        if (expenseData[name]) {
          expenseData[name] += amount; // Sum amounts for the same category
        } else {
          expenseData[name] = amount;
        }
      }
  
      return expenseData;
    }
  
    // Chart.js configuration
    let expenseChart;
    function updateChart() {
      const expenseData = getExpenseData();
      const labels = Object.keys(expenseData);
      const data = Object.values(expenseData);
  
      // If a chart already exists, destroy it before creating a new one
      if (expenseChart) {
        expenseChart.destroy();
      }
  
      const ctx = document.getElementById('expenseChart').getContext('2d');
      expenseChart = new Chart(ctx, {
        type: 'pie', // Pie chart
        data: {
          labels: labels, // Expense categories
          datasets: [{
            label: 'Expenses',
            data: data, // Corresponding amounts
            backgroundColor: [
              'rgba(255, 99, 132, 0.2)',
              'rgba(54, 162, 235, 0.2)',
              'rgba(255, 206, 86, 0.2)',
              'rgba(75, 192, 192, 0.2)',
              'rgba(153, 102, 255, 0.2)',
              'rgba(255, 159, 64, 0.2)'
            ],
            borderColor: [
              'rgba(255, 99, 132, 1)',
              'rgba(54, 162, 235, 1)',
              'rgba(255, 206, 86, 1)',
              'rgba(75, 192, 192, 1)',
              'rgba(153, 102, 255, 1)',
              'rgba(255, 159, 64, 1)'
            ],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
            },
          }
        }
      });
    }
  </script>
