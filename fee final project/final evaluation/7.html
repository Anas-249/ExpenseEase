<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.2.1/dist/chart.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" crossorigin="anonymous" />
  <title>Expense Ease</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #eef2f3, #d5dbe4);
      margin: 0;
      padding: 0;
    }

    .navbar {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover {
      color: #45a049;
    }

    .expense-tracker {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
    }

    .expense-tracker h2, h3 {
      color: #4CAF50;
    }

    .form-control {
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .btn {
      background: #4CAF50;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #45a049;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f4f4f4;
      color: #4CAF50;
    }

    .chart-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 40px;
    }

    .chart-container {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .chart-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Expense Ease</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="base.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="add.html">Add</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="display.html">History</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/limit">Limit</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="reportDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Report</a>
          <div class="dropdown-menu" aria-labelledby="reportDropdown">
            <a class="dropdown-item" href="/today">Today</a>
            <a class="dropdown-item" href="/month">Month</a>
            <a class="dropdown-item" href="/year">Year</a>
          </div>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fa fa-user"></i> User
          </a>
          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
            <a class="dropdown-item" href="#">Profile</a>
            <a class="dropdown-item" href="#">Settings</a>
            <a class="dropdown-item" href="#">Contact Us</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item text-danger" href="home.html">Log Out</a>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="expense-tracker">
      <h2>Track Your Expenses</h2>
      <form id="expense-form">
        <input type="text" id="expense-name" class="form-control" placeholder="Expense Name" required>
        <input type="number" id="expense-amount" class="form-control" placeholder="Amount" min="0" required>
        <input type="date" id="expense-date" class="form-control" required>
        <button type="submit" class="btn btn-block">Add Expense</button>
      </form>

      <h3>Expense History</h3>
      <table>
        <thead>
          <tr>
            <th>Expense Name</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expense-history-table">
          <!-- Dynamic rows will go here -->
        </tbody>
      </table>
    </div>

    <div class="chart-row">
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="lineChart"></canvas>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2024 Expense Ease. All rights reserved.</p>
  </footer>
</body>
<script>
    const pieChartData = {
    labels: [],
    datasets: [
        {
        label: 'Expenses',
        data: [],
        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'],
        hoverOffset: 4,
        },
    ],
    };

    const lineChartData = {
    labels: [],
    datasets: [
        {
        label: 'Expense Trend',
        data: [],
        fill: false,
        borderColor: '#36A2EB',
        tension: 0.1,
        },
    ],
    };

    const pieCtx = document.getElementById('expenseChart').getContext('2d');
    const lineCtx = document.getElementById('lineChart').getContext('2d');

    const pieChart = new Chart(pieCtx, {
    type: 'pie',
    data: pieChartData,
    options: { responsive: true },
    });

    const lineChart = new Chart(lineCtx, {
    type: 'line',
    data: lineChartData,
    options: { responsive: true },
    });

    document.getElementById('expense-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const name = document.getElementById('expense-name').value.trim();
    const amount = parseFloat(document.getElementById('expense-amount').value.trim());
    const date = document.getElementById('expense-date').value;

    if (!name || isNaN(amount) || amount <= 0 || !date) {
        alert('Please provide valid inputs.');
        return;
    }

    const table = document.getElementById('expense-history-table');
    const row = table.insertRow();
    row.insertCell(0).textContent = name;
    row.insertCell(1).textContent = `$${amount.toFixed(2)}`;
    row.insertCell(2).textContent = new Date(date).toLocaleDateString();
    const deleteCell = row.insertCell(3);
    const deleteButton = document.createElement('button');
    deleteButton.textContent = 'Delete';
    deleteButton.className = 'btn btn-danger btn-sm';
    deleteButton.onclick = function () {
        table.deleteRow(row.rowIndex - 1);
        removeExpenseFromCharts(name);
    };
    deleteCell.appendChild(deleteButton);

    updateCharts(name, amount, date);

    document.getElementById('expense-form').reset();
    });

    function updateCharts(name, amount, date) {
    const pieIndex = pieChartData.labels.indexOf(name);
    if (pieIndex > -1) {
        pieChartData.datasets[0].data[pieIndex] += amount;
    } else {
        pieChartData.labels.push(name);
        pieChartData.datasets[0].data.push(amount);
    }
    pieChart.update();

    lineChartData.labels.push(new Date(date).toLocaleDateString());
    lineChartData.datasets[0].data.push(amount);
    lineChart.update();
    }

    function removeExpenseFromCharts(name) {
    const pieIndex = pieChartData.labels.indexOf(name);
    if (pieIndex > -1) {
        pieChartData.labels.splice(pieIndex, 1);
        pieChartData.datasets[0].data.splice(pieIndex, 1);
        pieChart.update();
    }
    }
</script>
</html>
