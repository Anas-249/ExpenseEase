<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.2.1/dist/chart.min.js"></script>
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" crossorigin="anonymous"/>
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f3f4f6, #e9ecef);
      margin: 0;
      padding: 0;
    }

    .navbar {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
    }

    .expense-tracker {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .expense-form h2, .expense-history h3 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 20px;
    }

    .expense-form input, .expense-form button {
      margin-bottom: 15px;
      border-radius: 6px;
      font-size: 16px;
    }

    .expense-form button {
      background: #4CAF50;
      color: white;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .expense-form button:hover {
      background: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      text-align: center;
      padding: 10px;
      border: 1px solid #ddd;
    }

    table th {
      background: #4CAF50;
      color: white;
    }

    table tr:nth-child(even) {
      background: #f9f9f9;
    }

    .chart-container {
      margin: 30px auto;
      max-width: 700px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">MyBudget</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="base.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="add.html">Add Expense</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="display.html">History</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Limit</a>
        </li>
      </ul>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fa fa-user-circle"></i> User
          </a>
          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userMenu">
            <a class="dropdown-item" href="#">Profile</a>
            <a class="dropdown-item" href="#">Settings</a>
            <a class="dropdown-item" href="#">Contact Us</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item text-danger" href="#">Log Out</a>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="expense-tracker">
      <div class="expense-form">
        <h2>Track Your Expenses</h2>
        <form id="expense-form">
          <input type="text" id="expense-name" class="form-control" placeholder="Expense Name" required>
          <input type="number" id="expense-amount" class="form-control" placeholder="Amount" min="0" required>
          <input type="date" id="expense-date" class="form-control" required>
          <button type="submit" class="btn btn-block">Add Expense</button>
        </form>
      </div>
      <div class="expense-history">
        <h3>Expense History</h3>
        <table>
          <thead>
            <tr>
              <th>Expense Name</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dynamic rows will go here -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2024 MyBudget. All rights reserved.</p>
  </footer>

  <script>
     document.getElementById('expense-form').addEventListener('submit', function(event) {
  event.preventDefault(); // Prevent form submission

  // Get input values
  const name = document.getElementById('expense-name').value.trim(); // Ensure no leading/trailing spaces
  const amount = document.getElementById('expense-amount').value.trim(); // Get amount as string
  const date = document.getElementById('expense-date').value; // Get date

  // Input Validation
  if (!name) {
    alert('Expense name cannot be empty. Please provide a valid name.');
    return; // Stop further execution
  }

  if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
    alert('Amount must be a positive number. Please correct it.');
    return; // Stop further execution
  }

  if (!date) {
    alert('Date cannot be empty. Please select a valid date.');
    return; // Stop further execution
  }

  // Add the expense to the history if validation passes
  addExpenseToHistory(name, parseFloat(amount), date);

  // Update the chart
  updateChart(name, parseFloat(amount));

  // Clear the form inputs after successful submission
  document.getElementById('expense-name').value = '';
  document.getElementById('expense-amount').value = '';
  document.getElementById('expense-date').value = '';
});

function addExpenseToHistory(name, amount, date) {
  const tableBody = document.getElementById('expense-history-table').getElementsByTagName('tbody')[0];

  // Create a new row and cells
  const row = tableBody.insertRow();

  const cell1 = row.insertCell(0);
  const cell2 = row.insertCell(1);
  const cell3 = row.insertCell(2);

  // Set the values for each cell
  cell1.textContent = name;
  cell2.textContent = `$${amount.toFixed(2)}`; // Format amount to two decimal places
  cell3.textContent = new Date(date).toLocaleDateString();

  // Add delete button
  const deleteCell = row.insertCell(3);
  const deleteButton = document.createElement('button');
  deleteButton.textContent = 'Delete';
  deleteButton.classList.add('delete-btn');
  deleteButton.onclick = function () {
    tableBody.deleteRow(row.rowIndex - 1); // Remove the row
    removeExpenseFromChart(name); // Remove from chart
  };
  deleteCell.appendChild(deleteButton);
}

// Chart.js Setup
const ctx = document.getElementById('expenseChart').getContext('2d');
const chartData = {
  labels: [], // Expense categories (names)
  datasets: [
    {
      label: 'Expenses',
      data: [], // Expense amounts
      backgroundColor: [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
      ],
      hoverOffset: 4,
    },
  ],
};

const expenseChart = new Chart(ctx, {
  type: 'pie',
  data: chartData,
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
      },
      tooltip: {
        callbacks: {
          label: function (tooltipItem) {
            const label = chartData.labels[tooltipItem.dataIndex];
            const value = chartData.datasets[0].data[tooltipItem.dataIndex];
            return `${label}: $${value.toFixed(2)}`;
          },
        },
      },
    },
  },
});

// Update the chart when a new expense is added
function updateChart(name, amount) {
  const index = chartData.labels.indexOf(name);
  if (index > -1) {
    // If the category exists, add to the existing amount
    chartData.datasets[0].data[index] += amount;
  } else {
    // Otherwise, add a new category
    chartData.labels.push(name);
    chartData.datasets[0].data.push(amount);
  }
  expenseChart.update();
}

// Remove an expense from the chart when deleted
function removeExpenseFromChart(name) {
  const index = chartData.labels.indexOf(name);
  if (index > -1) {
    chartData.labels.splice(index, 1);
    chartData.datasets[0].data.splice(index, 1);
    expenseChart.update();
  }
}
  </script>
</body>
</html>
